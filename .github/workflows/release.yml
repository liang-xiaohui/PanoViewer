name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS disk image
        run: ./scripts/build_macos.sh

      - name: Upload macOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ github.ref_name }}' --pattern SHA256SUMS.txt --dir dist
          shasum -a 256 dist/PanoViewer-macOS.dmg | sed 's#dist/##' >> dist/SHA256SUMS.txt
          gh release upload '${{ github.ref_name }}' dist/PanoViewer-macOS.dmg dist/SHA256SUMS.txt --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build standalone HTML
        run: python scripts/build.py

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Check signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $available = -not [String]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign Windows executable
        if: ${{ steps.signing.outputs.available == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'PanoViewer-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'signtool.exe was not found.' }
          & $signTool sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/PanoViewer.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          $signature = Get-AuthenticodeSignature dist/PanoViewer.exe
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }

      - name: Note unsigned build
        if: ${{ steps.signing.outputs.available != 'true' }}
        shell: pwsh
        run: Write-Host 'WINDOWS_CERTIFICATE is not configured; publishing an unsigned executable.'

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item dist/PanoViewer.exe dist/PanoViewer-Windows-x64.exe
          Copy-Item 'dist/全景查看器-独立版.html' dist/PanoViewer-Standalone.html
          $files = @('dist/PanoViewer-Windows-x64.exe', 'dist/PanoViewer-Standalone.html')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            dist/PanoViewer-Windows-x64.exe `
            dist/PanoViewer-Standalone.html `
            dist/SHA256SUMS.txt `
            --title "PanoViewer ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
